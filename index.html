<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tic-Tac-Toe Pro is a polished, animated Tic-Tac-Toe game built with React and JavaScript. Play with a friend or against a minimax computer." />
    <meta name="theme-color" content="#141514" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Tic-Tac-Toe Pro</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('ttt:prefs'));
          if (p && (p.theme === 'light' || p.theme === 'dark')) {
            document.documentElement.setAttribute('data-theme', p.theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tic-Tac-Toe Pro needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
